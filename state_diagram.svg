<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .state { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .label { font: 700 22px sans-serif; fill: #0f172a; text-anchor: middle; }
      .event { font: 16px sans-serif; fill: #334155; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .title { font: 700 28px sans-serif; fill: #0f172a; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <text x="500" y="45" class="title">Boy State Machine · AUTO_RUN</text>

  <circle cx="95" cy="145" r="44" class="state"/>
  <text x="95" y="152" class="label">IDLE</text>
  <rect x="380" y="100" width="190" height="90" rx="45" class="state"/>
  <text x="475" y="153" class="label">RUN</text>
  <rect x="755" y="100" width="190" height="90" rx="45" class="state"/>
  <text x="850" y="153" class="label">SLEEP</text>
  <rect x="350" y="390" width="250" height="100" rx="50" class="state"/>
  <text x="475" y="450" class="label">AUTO_RUN</text>

  <path d="M139 145 H378" class="line"/>
  <text x="258" y="130" class="event">← / →</text>
  <path d="M380 175 H140" class="line"/>
  <text x="260" y="205" class="event">키를 놓음</text>
  <path d="M95 190 V390 H348" class="line"/>
  <text x="205" y="365" class="event">A 키</text>
  <path d="M475 390 V192" class="line"/>
  <text x="525" y="300" class="event">5초 경과</text>
  <path d="M570 145 H753" class="line"/>
  <text x="662" y="130" class="event">IDLE 5초</text>
  <path d="M850 190 V265 H95 V190" class="line"/>
  <text x="470" y="255" class="event">Space → IDLE</text>
  <path d="M600 440 H850 V192" class="line"/>
  <text x="730" y="425" class="event">5초 경과</text>
  <path d="M350 440 H220 V145 H139" class="line"/>
  <text x="210" y="475" class="event">← / → 취소 후 RUN</text>

  <text x="500" y="565" class="event">AUTO_RUN: 빠른 속도 · 1.5배 확대 · 화면 끝에서 방향 반전</text>
</svg>
